- version: 0.2.0
  date: '2026-09-14'
  breaking: false
  highlights:
  - runOpenAIToolCall, runAnthropicToolUse, runGeminiFunctionCall and executeByName accept optional ExecuteOptions (signal, idempotencyKey, timeoutMs).
  - Source formatting and package-lock license metadata fixed (Apache-2.0).
- version: 0.1.3
  date: '2026-08-17'
  breaking: false
  highlights:
  - Invalid 2xx list responses raise ProtocolError instead of being normalized to an empty list.
  - Empty idempotency keys are rejected and no longer make execution retries appear safe without sending an Idempotency-Key header.
  - Connector handles clear stale memoized connection IDs.
- version: 0.1.2
  date: '2026-08-17'
  breaking: false
  highlights:
  - CatalogClient.search() uses the same /marketplace/search endpoint as the Vinkius website.
- version: 0.1.0
  date: '2026-08-12'
  breaking: false
  highlights:
  - First public release of @vinkius/connect - Fluent API, low-level resource clients, framework adapters.

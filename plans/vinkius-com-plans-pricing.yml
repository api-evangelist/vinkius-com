description: Four self-serve monthly tiers metered in Connector calls, plus an enterprise "Talk to sales" tier. Every plan includes the full managed catalog; the plan sets call volume, history and controls. Prices in USD as shown on the default (monthly) toggle; an annual toggle exists but its prices were not captured. The site's mcp.json also names a Free plan, which the pricing page does not price or describe.
currency: USD
plan_count: 5
overage:
  price: $5 per 10,000 requests
  behavior: Connections remain active above the monthly allowance; additional usage is added to the next invoice.
refunds: Subscriptions are non-refundable; cancel any time, access remains through the end of the billing period.

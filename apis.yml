  name: Vinkius API
  position: Producing
  description: 'REST API behind the AI Connect SDK: application users, connector connections, write-only credentials, connection
    tokens, catalog and marketplace search, plus the execution plane for capabilities. Authenticated with a vk_app_sk_* application
    key as a Bearer token. No OpenAPI is published; the contract is documented through the first-party TypeScript SDK reference.'

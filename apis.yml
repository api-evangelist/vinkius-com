- aid: vinkius-com:vinkius-edge-mcp
  name: Vinkius Edge MCP
  position: Producing
  description: The hosted MCP data plane. Every connector is a remote MCP server at https://edge.vinkius.com/{connection_token}/mcp;
    the host also serves OAuth 2 authorization-server and protected-resource metadata with dynamic client registration. Tool
    schemas are per connector and require a connection token.
  humanURL: https://vinkius.com/en/ai-connections
  baseURL: https://edge.vinkius.com

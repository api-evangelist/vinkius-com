aid: vinkius-com
name: Vinkius
description: 'Vinkius is an AI connectivity cloud: a managed catalog of thousands of hosted Model Context Protocol (MCP) Connectors
  that AI agents call through one URL per connector, working in ChatGPT, Claude, Gemini, Cursor and other MCP clients. Connectors
  run in a sealed sandbox on the Vinkius Edge (edge.vinkius.com) with credential encryption, governance policies, audit trails,
  spend controls and log streaming. Developers build on it with the AI Connect SDK (@vinkius/connect) over the Vinkius API
  (api.vinkius.com), and publish their own connectors with the open source MCP Fusion TypeScript framework.'
